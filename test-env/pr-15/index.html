// has to be announced in text, since sighted play reads it straight off
// the rendered digit and cell styling.
function updateCellAriaLabel(cell) {
    const r = parseInt(cell.dataset.row, 10);
    const c = parseInt(cell.dataset.col, 10);
    const boxNum = Math.floor(r / 3) * 3 + Math.floor(c / 3) + 1;
    const val = cell.querySelector(".cell-value").textContent.trim();
    const state = !val ? "empty" : (givenMask[r][c] ? `given ${val}` : `you entered ${val}`);
    cell.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}, box ${boxNum}, ${state}`);
}

// Arrow-key navigation across the board, with a roving tabindex (only the
// focused cell is ever a Tab stop) so the board is fully operable without
// a mouse or touch — previously it had no keyboard handling at all.
// Moving focus also selects the cell (matching a tap), and 1-9 while a
// cell is focused places/pencil-marks that digit via the same number tile
// a mouse/touch user would press, so no separate keyboard-only input path
// has to be kept in sync with the real placement logic.
board.addEventListener("keydown", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell) return;

    const r = parseInt(cell.dataset.row, 10);
    const c = parseInt(cell.dataset.col, 10);

    const deltas = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (deltas[e.key]) {
        e.preventDefault();
        const [dr, dc] = deltas[e.key];
        const nr = Math.min(8, Math.max(0, r + dr));
        const nc = Math.min(8, Math.max(0, c + dc));
        const nextCell = board.children[nr * 9 + nc];
        cell.tabIndex = -1;
        nextCell.tabIndex = 0;
        nextCell.focus(); // triggers the focusin listener below, which selects it
        return;
    }

    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        onCellClick(cell);
        return;
    }

    if (e.key >= "1" && e.key <= "9") {
        e.preventDefault();
        if (selectedCell !== cell) onCellClick(cell);
        numberBar.children[parseInt(e.key, 10) - 1].click();
    }
});

// Selection follows focus however focus arrives — arrow keys (above),
// but also a plain Tab landing directly on the board's one tab-stop
// cell, which used to leave selectedCell out of sync with what's
// actually focused (relying on the browser's own inconsistent default
// focus ring instead of this app's own, far more visible one).
board.addEventListener("focusin", (e) => {
    const cell = e.target.closest(".cell");
    if (cell) onCellClick(cell);
});

function hasActivePencilMarksOnBoard() {
    for (let i = 0; i < board.children.length; i++) {
        const digits = board.children[i]._pencilDigits;
        if (digits) {
            for (let n = 1; n <= 9; n++) {
                if (digits[n].classList.contains("active")) return true;
            }
        }
    }
    return false;
}

function buildBoard() {
    board.innerHTML = "";
    givenMask.length = 0;
    for (let k = 1; k <= 9; k++) placements[k] = [];
    completedRows.fill(false);
    completedCols.fill(false);
    completedBoxes.fill(false);
    completedDigits.fill(false);

    selectedCell = null;
    gameWon = false;
    currentHintState = null;
    currentHintLevel = 0;
    hintTraceCells = [];
    hintTraceTarget = null;

    for (let r = 0; r < 9; r++) {
        givenMask[r] = [];
        for (let c = 0; c < 9; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";

            if ((c + 1) % 3 === 0 && c !== 8) cell.classList.add("box-right");
            if ((r + 1) % 3 === 0 && r !== 8) cell.classList.add("box-bottom");

            const inner = document.createElement("div");
            inner.className = "cell-inner";

            const pencilContainer = document.createElement("div");
            pencilContainer.className = "pencil-container";

            const pencilDigits = {};
            for (let n = 1; n <= 9; n++) {
                const span = document.createElement("div");
                span.className = "pencil-digit";
                span.textContent = n;
                pencilContainer.appendChild(span);
                pencilDigits[n] = span;
            }

            const valueSpan = document.createElement("div");
            valueSpan.className = "cell-value";

            inner.appendChild(pencilContainer);
            inner.appendChild(valueSpan);
            cell.appendChild(inner);

            const val = puzzle[r][c];
            if (val !== 0) {
                valueSpan.textContent = val;
                cell.classList.add("given");
                givenMask[r][c] = true;
                placements[val].push(r * 9 + c);
            } else {
                givenMask[r][c] = false;
            }

            cell.dataset.row = r;
            cell.dataset.col = c;
            cell._pencilDigits = pencilDigits;

            // Roving tabindex: only one cell is ever a Tab stop at a time
            // (arrow keys move it — see the board keydown handler below),
            // so keyboard users don't have to tab through 81 stops to
            // reach the board or move within it.
            cell.setAttribute("role", "gridcell");
            cell.tabIndex = (r === 0 && c === 0) ? 0 : -1;
            updateCellAriaLabel(cell);

            cell.addEventListener("click", () => onCellClick(cell));
            board.appendChild(cell);
        }
    }
    checkAndBoldCompletedNumbers();
    winMessage.textContent = "";
}

/* ==========================================================================
   4. STATE PERSISTENCE & USER INPUT
   ========================================================================== */
function saveGameState() {
    if (gameWon) {
        localStorage.removeItem(STORAGE_KEY);
        return;
    }

    const currentCells = [];
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const cell = board.children[r * 9 + c];
            if (!cell) continue;

            const val = parseInt(cell.querySelector(".cell-value").textContent || "0", 10);
            const pencils = [];
            const digits = cell._pencilDigits;
            if (digits) {
                for (let n = 1; n <= 9; n++) {
                    if (digits[n].classList.contains("active")) pencils.push(n);
                }
            }
            currentCells.push({ r, c, val, pencils });
        }
    }

    const state = {
        puzzle,
        solution,
        difficulty: difficultySelect.value,
        givenMask,
        guardNotesMode,
        cells: currentCells
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// Guards against a corrupted save (e.g. one written before puzzle
// generation ever completed) getting trusted and resumed forever — a
// blank board with an all-zero solution reads as every row/col/box/digit
// being simultaneously "complete", which floods the board with glow and
// can never be won to self-heal via the normal localStorage.removeItem()
// on a real win.
function isValidSavedPuzzleState(state) {
    if (!state || !Array.isArray(state.puzzle) || !Array.isArray(state.solution) || !Array.isArray(state.cells)) {
        return false;
    }
    if (state.puzzle.length !== 9 || state.solution.length !== 9) return false;

    // A genuine solution grid is always fully filled with 1-9; any zero
    // means this was never a real solved puzzle.
    const solutionIsComplete = state.solution.every(row =>
        Array.isArray(row) && row.length === 9 && row.every(v => v >= 1 && v <= 9)
    );
    const puzzleHasGivens = state.puzzle.some(row => Array.isArray(row) && row.some(v => v !== 0));
    return solutionIsComplete && puzzleHasGivens;
}

function loadSavedGameState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;

    try {
        const state = JSON.parse(saved);
        if (!isValidSavedPuzzleState(state)) {
            console.warn("Sudoku: discarding a corrupted saved game instead of resuming a broken board.");
            localStorage.removeItem(STORAGE_KEY);
            return false;
        }
        puzzle = state.puzzle;
        solution = state.solution;
        if (state.difficulty) difficultySelect.value = state.difficulty;
        if (typeof state.guardNotesMode !== "undefined") {
            guardNotesMode = state.guardNotesMode;
            guardNotesToggle.textContent = `Guard Pencil: ${guardNotesMode ? "ON" : "OFF"}`;
            guardNotesToggle.classList.toggle("active", guardNotesMode);
        }

        buildBoard();

        state.cells.forEach(item => {
            const cell = board.children[item.r * 9 + item.c];
            if (cell && !givenMask[item.r][item.c]) {
                const valueSpan = cell.querySelector(".cell-value");
                if (item.val !== 0) {
                    valueSpan.textContent = item.val;
                    if (!placements[item.val].includes(item.r * 9 + item.c)) {
                        placements[item.val].push(item.r * 9 + item.c);
                    }
                }
                item.pencils.forEach(num => {
                    if (cell._pencilDigits[num]) {
                        cell._pencilDigits[num].classList.add("active");
                    }
                });
            }
        });

        checkAndBoldCompletedNumbers(true);
        updateNumberTileStyles();
        setStatusText("Resumed saved game.", 3000);
        return true;
    } catch (e) {
        console.error("Failed to restore game state", e);
        return false;
    }
}

function triggerUnitGlow(cellIndices) {
    cellIndices.forEach(idx => {
        const cell = board.children[idx];
        if (cell) {
            cell.classList.add("glow");
            setTimeout(() => cell.classList.remove("glow"), 2000);
        }
    });
}

// silent=true marks already-complete units as complete (so they don't
// glow again later) without triggering the glow itself — used when
// restoring a saved game, where every unit finished in a prior session
// would otherwise look "newly" completed and glow all at once.
function checkAndBoldCompletedNumbers(silent = false) {
    const grid = getCurrentGrid();

    // Check completed rows
    for (let r = 0; r < 9; r++) {
        const rowFilled = grid[r].every((val, c) => val === solution[r][c]);
        if (rowFilled && !completedRows[r]) {
            completedRows[r] = true;
            if (!silent) {
                const indices = [];
                for (let c = 0; c < 9; c++) indices.push(r * 9 + c);
                triggerUnitGlow(indices);
            }
        }
    }

    // Check completed columns
    for (let c = 0; c < 9; c++) {
        let colFilled = true;
        for (let r = 0; r < 9; r++) {
            if (grid[r][c] !== solution[r][c]) { colFilled = false; break; }
        }
        if (colFilled && !completedCols[c]) {
            completedCols[c] = true;
            if (!silent) {
                const indices = [];
                for (let r = 0; r < 9; r++) indices.push(r * 9 + c);
                triggerUnitGlow(indices);
            }
        }
    }

    // Check completed 3x3 boxes
    for (let b = 0; b < 9; b++) {
        const br = Math.floor(b / 3) * 3;
        const bc = (b % 3) * 3;
        let boxFilled = true;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                if (grid[r][c] !== solution[r][c]) { boxFilled = false; break; }
            }
        }
        if (boxFilled && !completedBoxes[b]) {
            completedBoxes[b] = true;
            if (!silent) {
                const indices = [];
                for (let r = br; r < br + 3; r++) {
                    for (let c = bc; c < bc + 3; c++) indices.push(r * 9 + c);
                }
                triggerUnitGlow(indices);
            }
        }
    }

    // Check completed digits (all 9 placed)
    for (let num = 1; num <= 9; num++) {
        if (placements[num].length === 9) {
            placements[num].forEach(index => board.children[index].classList.add("completed-number"));
            if (numberBar.children[num - 1]) numberBar.children[num - 1].classList.add("completed-number");
            if (!completedDigits[num]) {
                completedDigits[num] = true;
                if (!silent) triggerUnitGlow(placements[num]);
            }
        }
    }
}

for (let n = 1; n <= 9; n++) {
    const tile = document.createElement("div");
    tile.className = "number-tile ink";
    tile.textContent = n;
    tile.setAttribute("role", "button");
    tile.setAttribute("aria-label", `Enter ${n}`);
    tile.tabIndex = 0;
    tile.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            tile.click();
        }
    });

    tile.addEventListener("click", () => {
        if (gameWon) return;

        if (!selectedCell) {
            setStatusText("Select a cell first.", 2000);
            selectedNumber = n;
            updateNumberTileStyles();
            highlightSameNumbers(n);
            return;
        }

        const r = parseInt(selectedCell.dataset.row, 10);
        const c = parseInt(selectedCell.dataset.col, 10);

        if (givenMask[r][c]) {
            setStatusText("You can't change a given cell.", 2000);
            return;
        }

        const correctValue = solution[r][c];

        if (pencilMode) {
            // A cell that already has a value (correctly guarded above for
            // givens, but a player's own already-placed digit reaches here
            // too) has no use for pencil marks — without this check,
            // isSafe() only ever looks at *other* candidates for this cell,
            // so a mark for a different digit than the one already placed
            // could pass Guard Pencil and render on top of the answer,
            // illegibly overlapping it.
            if (getCurrentGrid()[r][c] !== 0) {
                setStatusText("This cell is already filled in — no need for pencil marks here.", 2500);
                return;
            }

            if (guardNotesMode) {
                const digits = selectedCell._pencilDigits;
                const isCurrentlyActive = digits && digits[n] && digits[n].classList.contains("active");

                if (!isCurrentlyActive && !isSafe(getCurrentGrid(), r, c, n)) {
                    flashWrong(selectedCell);
                    setStatusText(`Number ${n} conflicts with this row, column, or box!`, 3000);
                    return;
                }
            }

            togglePencilMark(selectedCell, n);
            selectedNumber = n;
            updateNumberTileStyles();
            highlightSameNumbers(n);
            saveGameState();
            return;
        }

        if (n !== correctValue) {
            flashWrong(selectedCell);
            setStatusText(`${n} doesn't belong in row ${r + 1}, column ${c + 1}. Try another number.`, 2000);
            selectedNumber = n;
            updateNumberTileStyles();
            highlightSameNumbers(n);
            return;
        }

        const valueSpan = selectedCell.querySelector(".cell-value");
        clearAllPencilsInCell(selectedCell);
        valueSpan.textContent = correctValue;
        updateCellAriaLabel(selectedCell);

        const index = r * 9 + c;
        if (!placements[correctValue].includes(index)) {
            placements[correctValue].push(index);
        }

        autoRemovePencilMarks(r, c, correctValue);
        checkAndBoldCompletedNumbers();

        currentHintState = null;
        currentHintLevel = 0;

        // The hint this trace was marking has now actually been acted on —
        // clear it. A correct placement elsewhere on the board (unrelated
        // to the current hint) deliberately leaves the trace in place.
        if (hintTraceTarget && hintTraceTarget.r === r && hintTraceTarget.c === c) {
            clearHintTrace();
        }

        if (isBoardSolved()) {
            setTimeout(onWin, 300);
        } else {
            saveGameState();
        }

        selectedNumber = n;
        updateNumberTileStyles();
        highlightSameNumbers(n);
    });

    numberBar.appendChild(tile);
}

function updateNumberTileStyles() {
    [...numberBar.children].forEach(tile => {
        const n = parseInt(tile.textContent, 10);
        const isCompleted = placements[n] && placements[n].length === 9;
        tile.className = `number-tile ${pencilMode ? "pencil" : "ink"}${isCompleted ? " completed-number" : ""}`;
        if (n === selectedNumber) tile.classList.add("selected");
    });
}

const pencilToggle = document.getElementById("pencilToggle");
pencilToggle.addEventListener("click", () => {
    if (gameWon) return;
    pencilMode = !pencilMode;
    pencilToggle.textContent = `Pencil Mode: ${pencilMode ? "ON" : "OFF"}`;
    pencilToggle.classList.toggle("active", pencilMode);
    pencilToggle.setAttribute("aria-pressed", String(pencilMode));
    updateNumberTileStyles();

    setStatusText(`Pencil Mode ${pencilMode ? "ON" : "OFF"}: ${pencilMode ? "Use it to note down all the numbers a cell could still be, instead of a final answer." : "Numbers you enter now go in as final answers again."}`);
});

const guardNotesToggle = document.getElementById("guardNotesToggle");
guardNotesToggle.addEventListener("click", () => {
    if (gameWon) return;
    guardNotesMode = !guardNotesMode;
    guardNotesToggle.textContent = `Guard Pencil: ${guardNotesMode ? "ON" : "OFF"}`;
    guardNotesToggle.classList.toggle("active", guardNotesMode);
    guardNotesToggle.setAttribute("aria-pressed", String(guardNotesMode));

    setStatusText(`Guard Pencil ${guardNotesMode ? "ON" : "OFF"}: ${guardNotesMode ? "Prevents adding pencil marks that conflict with placed numbers." : "Allows manual pencil freedom."}`);
    
    saveGameState();
});

function togglePencilMark(cell, num) {
    const span = cell._pencilDigits[num];
    if (span) span.classList.toggle("active");
}

function clearAllPencilsInCell(cell) {
    for (let n = 1; n <= 9; n++) cell._pencilDigits[n].classList.remove("active");
}

function autoRemovePencilMarks(r, c, num) {
    for (let cc = 0; cc < 9; cc++) {
        if (cc !== c) board.children[r * 9 + cc]._pencilDigits[num].classList.remove("active");
    }
    for (let rr = 0; rr < 9; rr++) {
        if (rr !== r) board.children[rr * 9 + c]._pencilDigits[num].classList.remove("active");
    }
    const br = Math.floor(r / 3) * 3;
    const bc = Math.floor(c / 3) * 3;
    for (let rr = br; rr < br + 3; rr++) {
        for (let cc = bc; cc < bc + 3; cc++) {
            if (rr !== r || cc !== c) board.children[rr * 9 + cc]._pencilDigits[num].classList.remove("active");
        }
    }
}

function cellHasAnyPencilMarks(cell) {
    for (let n = 1; n <= 9; n++) {
        if (cell._pencilDigits[n].classList.contains("active")) return true;
    }
    return false;
}

// Only fills cells that currently have zero pencil marks of their own —
// it used to wipe and refill every empty cell unconditionally, silently
// discarding any marks a player had written in by hand with no warning
// and no way to undo it. Now a cell with even one hand-entered mark is
// left completely alone; this is a supplement for untouched cells, not
// a wholesale replacement of the player's own notes.
function autoFillAllPencils() {
    if (gameWon) return;
    const currentGrid = getCurrentGrid();
    let notesAdded = 0;
    let cellsSkipped = 0;

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const cell = board.children[r * 9 + c];
            if (givenMask[r][c] || currentGrid[r][c] !== 0) {
                // A filled/given cell showing pencil marks would be stray
                // leftover state, not a player's active notes — safe to
                // clean up rather than something to preserve.
                clearAllPencilsInCell(cell);
                continue;
            }
            if (cellHasAnyPencilMarks(cell)) {
                cellsSkipped++;
                continue;
            }
            for (let n = 1; n <= 9; n++) {
                if (isSafe(currentGrid, r, c, n)) {
                    cell._pencilDigits[n].classList.add("active");
                    notesAdded++;
                }
            }
        }
    }
    saveGameState();
    const skippedNote = cellsSkipped > 0 ? ` (left ${cellsSkipped} cell(s) with your own notes untouched)` : "";
    setStatusText(`Auto-Pencil: Filled ${notesAdded} pencil marks${skippedNote}.`, 5000);
}

function flashWrong(cell) {
    cell.classList.add("wrong");
    setTimeout(() => cell.classList.remove("wrong"), 400);
}

function isBoardSolved() {
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const val = parseInt(board.children[r * 9 + c].querySelector(".cell-value").textContent || "0", 10);
            if (val !== solution[r][c]) return false;
        }
    }
    return true;
}

function getCurrentGrid() {
    const grid = Array.from({ length: 9 }, () => Array(9).fill(0));
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            grid[r][c] = parseInt(board.children[r * 9 + c].querySelector(".cell-value").textContent || "0", 10);
        }
    }
    return grid;
}

/* ==========================================================================
   5. COMPLETE MULTI-TIER HINT & SOLVING ENGINE
   ========================================================================== */

// 1. Full House (Visual Scanning)
function findFullHouse(grid, candGrid, solutionGrid = solution) {
    for (let r = 0; r < 9; r++) {
        const emptyCols = [];
        for (let c = 0; c < 9; c++) if (grid[r][c] === 0) emptyCols.push(c);
        if (emptyCols.length === 1) {
            const c = emptyCols[0];
            const val = candGrid[r][c][0] || solutionGrid[r][c];
            return {
                r, c, val,
                method: "Full House",
                tier: "easy",
                tier1: `Row ${r+1} has only one empty cell left. Try using "Full House".`,
                tier2: `Scan Row ${r+1} to find its one empty cell, then count 1 through 9 across the row to see which digit is missing.`,
                tier3: `Row ${r+1} is missing ${val}. Place ${val} in Row ${r+1}, Column ${c+1}!`
            };
        }
    }
    for (let c = 0; c < 9; c++) {
        const emptyRows = [];
        for (let r = 0; r < 9; r++) if (grid[r][c] === 0) emptyRows.push(r);
        if (emptyRows.length === 1) {
            const r = emptyRows[0];
            const val = candGrid[r][c][0] || solutionGrid[r][c];
            return {
                r, c, val,
                method: "Full House",
                tier: "easy",
                tier1: `Column ${c+1} has only one empty cell left. Try using "Full House".`,
                tier2: `Scan Column ${c+1} to find its one empty cell, then count 1 through 9 down the column to see which digit is missing.`,
                tier3: `Column ${c+1} is missing ${val}. Place ${val} in Row ${r+1}, Column ${c+1}!`
            };
        }
    }
    for (let br = 0; br < 3; br++) {
        for (let bc = 0; bc < 3; bc++) {
            const empty = [];
            for (let r = br * 3; r < br * 3 + 3; r++) {
                for (let c = bc * 3; c < bc * 3 + 3; c++) {
                    if (grid[r][c] === 0) empty.push({ r, c });
                }
            }
            if (empty.length === 1) {
                const { r, c } = empty[0];
                const boxNum = br * 3 + bc + 1;
                const val = candGrid[r][c][0] || solutionGrid[r][c];
                return {
                    r, c, val,
                    method: "Full House",
                    tier: "easy",
                    tier1: `Box ${boxNum} has only one empty cell left. Try using "Full House".`,
                    tier2: `Scan Box ${boxNum} to find its one empty cell, then count 1 through 9 inside the box to see which digit is missing.`,
                    tier3: `Box ${boxNum} is missing ${val}. Place ${val} in Row ${r+1}, Column ${c+1}!`
                };
            }
        }
    }
    return null;
}

// 2. Hidden Singles / Cross-Hatching — box, row, AND column scanning
function findHiddenSingle(candGrid, grid = getCurrentGrid()) {
    for (const unit of UNITS_BOX_FIRST) {
        for (let n = 1; n <= 9; n++) {
            const spots = unit.cells.filter(({ r, c }) => candGrid[r][c].includes(n));
            if (spots.length !== 1) continue;
            const { r, c } = spots[0];

            let blockedByPlacedDigits = true;
            for (const { r: tr, c: tc } of unit.cells) {
                if ((tr !== r || tc !== c) && grid[tr][tc] === 0 && isSafe(grid, tr, tc, n)) {
                    blockedByPlacedDigits = false;
                }
            }

            const method = blockedByPlacedDigits ? "Cross-Hatching" : "Hidden Single";
            const tier1 = blockedByPlacedDigits
                ? `Somewhere in ${unit.label}, one digit has only a single remaining spot. Try using "${method}".`
                : `Somewhere in ${unit.label}, pencil marks show one digit fits in only one spot. Try using "${method}".`;
            const tier2 = blockedByPlacedDigits
                ? `Trace filled numbers across intersecting rows, columns, and boxes into ${unit.label}. Watch how they block empty spots until only one spot remains for a specific candidate.`
                : `Examine pencil marks in ${unit.label}. Only one open cell there can hold a specific missing digit.`;
            const tier3 = blockedByPlacedDigits
                ? `The placed ${n}s block every open spot in ${unit.label} except Row ${r+1}, Column ${c+1}. Place ${n} here!`
                : `Digit ${n} cannot go anywhere else in ${unit.label} based on candidate eliminations. Place ${n} in Row ${r+1}, Column ${c+1}!`;

            return { r, c, val: n, method, tier: "easy", tier1, tier2, tier3 };
        }
    }
    return null;
}

// 3. Naked Singles (Visual Intersection Check)
function findNakedSingle(candGrid) {
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (candGrid[r][c].length === 1) {
                const val = candGrid[r][c][0];
                const boxNum = Math.floor(r/3)*3 + Math.floor(c/3) + 1;
                return {
                    r, c, val,
                    method: "Naked Single",
                    tier: "easy",
                    tier1: `One cell in the grid already has only one possible digit left, once its row, column, and box are considered. Try using "Naked Single".`,
                    tier2: `It's somewhere in Box ${boxNum}. Check each empty cell there against the numbers already placed in its row, column, and box — one of them eliminates 8 out of 9 digits, leaving only one valid choice.`,
                    tier3: `All digits except ${val} are already present across Row ${r+1}, Column ${c+1}, or Box ${boxNum}. Place ${val} here!`
                };
            }
        }
    }
    return null;
}

// If eliminating `n` from exactly one of the cells in `eliminate` would
// leave that cell with only one remaining candidate, that cell becomes an
// immediate naked single as a side effect — worth calling out in the hint.
// Deliberately checks the *eliminated* cells, not any cell inside the box
// the elimination came from: a Pointing/Claiming elimination never touches
// candidates inside its own box, so a cell there can't be "resolved" by it.
function singleCellResolvedByElimination(candGrid, eliminate, n) {
    const resolved = eliminate
        .map(({ r, c }) => ({ r, c, remaining: candGrid[r][c].filter(x => x !== n) }))
        .filter(({ remaining }) => remaining.length === 1);
    return resolved.length === 1 ? resolved[0] : null;
}

// 4. Pointing Pairs/Triples & Claiming Candidates (Locked Candidates - Advanced Pencil Technique)
function findLockedCandidates(candGrid, solutionGrid = solution) {
    for (let br = 0; br < 3; br++) {
        for (let bc = 0; bc < 3; bc++) {
            for (let n = 1; n <= 9; n++) {
                const boxCells = [];
                for (let r = br * 3; r < br * 3 + 3; r++) {
                    for (let c = bc * 3; c < bc * 3 + 3; c++) {
                        if (candGrid[r][c].includes(n)) boxCells.push({ r, c });
                    }
                }
                if (boxCells.length >= 2 && boxCells.length <= 3) {
                    const sameRow = boxCells.every(cell => cell.r === boxCells[0].r);
                    if (sameRow) {
                        const r = boxCells[0].r;
                        const boxNum = br * 3 + bc + 1;

                        const eliminate = [];
                        for (let c = 0; c < 9; c++) {
                            if ((c < bc * 3 || c >= bc * 3 + 3) && candGrid[r][c].includes(n)) {
                                eliminate.push({ r, c, digits: [n] });
                            }
                        }

                        if (eliminate.length > 0) {
                            const targetR = boxCells[0].r;
                            const targetC = boxCells[0].c;
                            const methodName = boxCells.length === 2 ? "Pointing Pair" : "Pointing Triple";
                            const resolved = singleCellResolvedByElimination(candGrid, eliminate, n);
                            const cellList = boxCells.map(({ r, c }) => `Row ${r+1}, Col ${c+1}`).join(' / ');

                            return {
                                r: targetR,
                                c: targetC,
                                val: solutionGrid[targetR][targetC],
                                method: methodName,
                                tier: "medium",
                                eliminate,
                                highlightCells: boxCells,
                                tier1: `Look at pencil marks in Row ${r+1} inside Box ${boxNum} (${cellList}). Try using "${methodName}".`,
                                tier2: `Inside Box ${boxNum}, all possible locations for a key digit align strictly on Row ${r+1}.`,
                                tier3: resolved
                                    ? `Since ${n} must go in Row ${r+1} within Box ${boxNum}, eliminate pencil mark ${n} elsewhere along Row ${r+1}. This leaves ${solutionGrid[resolved.r][resolved.c]} in Row ${resolved.r+1}, Column ${resolved.c+1}!`
                                    : `Since ${n} must go in Row ${r+1} within Box ${boxNum}, eliminate pencil mark ${n} from all other cells outside Box ${boxNum} along Row ${r+1}.`
                            };
                        }
                    }

                    const sameCol = boxCells.every(cell => cell.c === boxCells[0].c);
                    if (sameCol) {
                        const c = boxCells[0].c;
                        const boxNum = br * 3 + bc + 1;

                        const eliminate = [];
                        for (let r = 0; r < 9; r++) {
                            if ((r < br * 3 || r >= br * 3 + 3) && candGrid[r][c].includes(n)) {
                                eliminate.push({ r, c, digits: [n] });
                            }
                        }

                        if (eliminate.length > 0) {
                            const targetR = boxCells[0].r;
                            const targetC = boxCells[0].c;
                            const methodName = boxCells.length === 2 ? "Pointing Pair" : "Pointing Triple";
                            const resolved = singleCellResolvedByElimination(candGrid, eliminate, n);
                            const cellList = boxCells.map(({ r, c }) => `Row ${r+1}, Col ${c+1}`).join(' / ');

                            return {
                                r: targetR,
                                c: targetC,
                                val: solutionGrid[targetR][targetC],
                                method: methodName,
                                tier: "medium",
                                eliminate,
                                highlightCells: boxCells,
                                tier1: `Look at pencil marks in Column ${c+1} inside Box ${boxNum} (${cellList}). Try using "${methodName}".`,
                                tier2: `Inside Box ${boxNum}, all possible locations for a key digit align strictly on Column ${c+1}.`,
                                tier3: resolved
                                    ? `Since ${n} must go in Column ${c+1} within Box ${boxNum}, eliminate pencil mark ${n} elsewhere along Column ${c+1}. This leaves ${solutionGrid[resolved.r][resolved.c]} in Row ${resolved.r+1}, Column ${resolved.c+1}!`
                                    : `Since ${n} must go in Column ${c+1} within Box ${boxNum}, eliminate pencil mark ${n} from all other cells outside Box ${boxNum} along Column ${c+1}.`
                            };
                        }
                    }
                }
            }
        }
    }
    return null;
}

// 4b. Claiming Candidates / Box-Line Reduction — the mirror image of Pointing:
// a digit confined to one box *within* a row or column eliminates that
// digit from the rest of the box.
function findClaimingCandidates(candGrid, solutionGrid = solution) {
    const lineUnits = ALL_UNITS.filter(u => u.kind === "row" || u.kind === "col");
    for (const unit of lineUnits) {
        for (let n = 1; n <= 9; n++) {
            const spots = unit.cells.filter(({ r, c }) => candGrid[r][c].includes(n));
            if (spots.length < 2 || spots.length > 3) continue;

            const boxOf = ({ r, c }) => Math.floor(r / 3) * 3 + Math.floor(c / 3);
            const boxIdx = boxOf(spots[0]);
            if (!spots.every(cell => boxOf(cell) === boxIdx)) continue;

            const br = Math.floor(boxIdx / 3) * 3, bc = (boxIdx % 3) * 3;
            const inUnit = (r, c) => unit.cells.some(cell => cell.r === r && cell.c === c);
            const eliminate = [];
            for (let r = br; r < br + 3; r++) {
                for (let c = bc; c < bc + 3; c++) {
                    if (!inUnit(r, c) && candGrid[r][c].includes(n)) {
                        eliminate.push({ r, c, digits: [n] });
                    }
                }
            }
            if (eliminate.length === 0) continue;

            const target = spots[0];
            const boxNum = boxIdx + 1;
            const methodName = spots.length === 2 ? "Claiming Pair" : "Claiming Triple";
            const cellList = spots.map(({ r, c }) => `Row ${r+1}, Col ${c+1}`).join(' / ');

            return {
                r: target.r, c: target.c,
                val: solutionGrid[target.r][target.c],
                method: methodName,
                tier: "medium",
                eliminate,
                highlightCells: spots,
                tier1: `Look at pencil marks in ${unit.label} inside Box ${boxNum} (${cellList}). Try using "${methodName}".`,
                tier2: `Inside ${unit.label}, all possible locations for a key digit fall within Box ${boxNum}.`,
                tier3: `Since ${n} must go inside Box ${boxNum} along ${unit.label}, eliminate pencil mark ${n} from the rest of Box ${boxNum}.`
            };
        }
    }
    return null;
}

// 5. Naked Subsets — Pairs and Triples, checked across rows, columns, AND
// boxes (the original Naked Pair only checked rows).
function findNakedSubsetOfSize(candGrid, solutionGrid, size, methodName) {
    for (const unit of UNITS_BOX_FIRST) {
        const eligible = unit.cells.filter(({ r, c }) => candGrid[r][c].length >= 2 && candGrid[r][c].length <= size);
        if (eligible.length < size) continue;

        for (const combo of combinations(eligible, size)) {
            const unionDigits = new Set();
            combo.forEach(({ r, c }) => candGrid[r][c].forEach(d => unionDigits.add(d)));
            if (unionDigits.size !== size) continue;

            const comboKeys = new Set(combo.map(({ r, c }) => `${r}_${c}`));
            const eliminate = [];
            for (const { r, c } of unit.cells) {
                if (comboKeys.has(`${r}_${c}`)) continue;
                const overlap = candGrid[r][c].filter(d => unionDigits.has(d));
                if (overlap.length > 0) eliminate.push({ r, c, digits: overlap });
            }
            if (eliminate.length === 0) continue;

            const digitsArr = [...unionDigits].sort((a, b) => a - b);
            const focal = combo[0];
            const cellList = combo.map(({ r, c }) => `Row ${r+1}, Col ${c+1}`).join(' / ');

            return {
                r: focal.r, c: focal.c,
                val: solutionGrid[focal.r][focal.c],
                method: methodName,
                tier: "medium",
                eliminate,
                highlightCells: combo,
                tier1: `Look at pencil marks in ${unit.label} (${cellList}). Try using "${methodName}".`,
                tier2: `${unit.label} has ${size} cells whose candidates are limited to the same ${size} numbers between them.`,
                tier3: `Because ${digitsArr.join(', ')} must fill those ${size} cells in ${unit.label}, eliminate those pencil marks from every other cell in ${unit.label}.`
            };
        }
    }
    return null;
}

function findNakedPair(candGrid, solutionGrid = solution) {
    return findNakedSubsetOfSize(candGrid, solutionGrid, 2, "Naked Pair");
}

function findNakedTriple(candGrid, solutionGrid = solution) {
    return findNakedSubsetOfSize(candGrid, solutionGrid, 3, "Naked Triple");
}

// 6. X-Wing Pattern Analysis
// Generic "fish" pattern search — X-Wing (size 2) and Swordfish (size 3)
// are the same shape: a digit confined to `size` cross-lines across `size`
// parallel lines. Checked in BOTH directions (rows confined to columns, and
// its mirror image, columns confined to rows) — a puzzle can need either
// orientation, and checking only one misses roughly as many real patterns
// as it finds (confirmed empirically: about 1 in 8 solving steps in
// Medium/Hard/Expert puzzles had a column-oriented X-Wing available that a
// row-only search would never see). See REQUIREMENTS.md item 8.
function findFishAlongAxis(candGrid, solutionGrid, size, methodName, article, axis) {
    const lineLabel = axis === "row" ? "Rows" : "Columns";
    const crossLabel = axis === "row" ? "Columns" : "Rows";
    const sizeWord = size === 2 ? "two" : "three";

    for (let n = 1; n <= 9; n++) {
        const lineSpots = [];
        for (let p = 0; p < 9; p++) {
            const cross = [];
            for (let q = 0; q < 9; q++) {
                const r = axis === "row" ? p : q;
                const c = axis === "row" ? q : p;
                if (candGrid[r][c].includes(n)) cross.push(q);
            }
            if (cross.length >= 2 && cross.length <= size) lineSpots.push({ p, cross });
        }
        if (lineSpots.length < size) continue;

        for (const combo of combinations(lineSpots, size)) {
            const crossSet = new Set();
            combo.forEach(ls => ls.cross.forEach(q => crossSet.add(q)));
            if (crossSet.size !== size) continue;

            const lines = combo.map(ls => ls.p);
            const crossLines = [...crossSet];

            const eliminate = [];
            for (const q of crossLines) {
                for (let p = 0; p < 9; p++) {
                    if (lines.includes(p)) continue;
                    const r = axis === "row" ? p : q;
                    const c = axis === "row" ? q : p;
                    if (candGrid[r][c].includes(n)) eliminate.push({ r, c, digits: [n] });
                }
            }
            if (eliminate.length === 0) continue;

            const focalR = axis === "row" ? lines[0] : crossLines[0];
            const focalC = axis === "row" ? crossLines[0] : lines[0];
            const lineNums = lines.map(x => x + 1).join(', ');
            const crossNums = crossLines.map(x => x + 1).join(', ');
            const patternCells = combo.flatMap(ls => ls.cross.map(q => (
                axis === "row" ? { r: ls.p, c: q } : { r: q, c: ls.p }
            )));

            return {
                r: focalR, c: focalC,
                val: solutionGrid[focalR][focalC],
                method: methodName,
                tier: size === 2 ? "medium" : "hard",
                eliminate,
                highlightCells: patternCells,
                tier1: `Look at pencil marks in ${lineLabel} ${lineNums} across ${crossLabel} ${crossNums}. Try using "${methodName}".`,
                tier2: `A candidate digit is confined to the same ${sizeWord} ${crossLabel.toLowerCase()} across ${sizeWord} separate ${lineLabel.toLowerCase()}, forming ${article} ${methodName} pattern.`,
                tier3: `Because digit ${n} must occupy those ${lineLabel.toLowerCase()} within ${crossLabel} ${crossNums}, eliminate pencil mark ${n} from all other cells in those ${crossLabel.toLowerCase()}.`
            };
        }
    }
    return null;
}

function findFishPattern(candGrid, solutionGrid, size, methodName, article) {
    return findFishAlongAxis(candGrid, solutionGrid, size, methodName, article, "row") ||
           findFishAlongAxis(candGrid, solutionGrid, size, methodName, article, "col");
}

// 6. X-Wing Pattern Analysis
function findXWing(candGrid, solutionGrid = solution) {
    return findFishPattern(candGrid, solutionGrid, 2, "X-Wing", "an");
}

// 6b. Swordfish Pattern Analysis (X-Wing generalized to three rows/columns; Hard tier)
function findSwordfish(candGrid, solutionGrid = solution) {
    return findFishPattern(candGrid, solutionGrid, 3, "Swordfish", "a");
}

// 6b. XY-Wing — a bivalue "pivot" cell {X,Y} links to two other bivalue
// cells it shares a unit with, one {X,Z} and one {Y,Z}. Z must occupy the
// pivot or one of the two linked cells, so it can be eliminated from any
// cell that sees both linked cells.
function findXYWing(candGrid, solutionGrid = solution) {
    const biValueCells = [];
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (candGrid[r][c].length === 2) biValueCells.push({ r, c, cands: candGrid[r][c] });
        }
    }

    for (const pivot of biValueCells) {
        const [x, y] = pivot.cands;
        const linked = biValueCells.filter(cell =>
            !(cell.r === pivot.r && cell.c === pivot.c) && cellsSeeEachOther(cell, pivot)
        );

        for (const p1 of linked) {
            if (!p1.cands.includes(x) || p1.cands.includes(y)) continue;
            const z = p1.cands.find(d => d !== x);

            for (const p2 of linked) {
                if ((p2.r === p1.r && p2.c === p1.c)) continue;
                if (!p2.cands.includes(y) || !p2.cands.includes(z) || p2.cands.includes(x)) continue;

                const eliminate = [];
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if ((r === pivot.r && c === pivot.c) || (r === p1.r && c === p1.c) || (r === p2.r && c === p2.c)) continue;
                        if (candGrid[r][c].includes(z) && cellsSeeEachOther({ r, c }, p1) && cellsSeeEachOther({ r, c }, p2)) {
                            eliminate.push({ r, c, digits: [z] });
                        }
                    }
                }
                if (eliminate.length === 0) continue;

                return {
                    r: pivot.r, c: pivot.c,
                    val: solutionGrid[pivot.r][pivot.c],
                    method: "XY-Wing",
                    tier: "hard",
                    eliminate,
                    highlightCells: [pivot, p1, p2],
                    tier1: `Look at pencil marks in Row ${pivot.r+1}, Col ${pivot.c+1} (pivot) / Row ${p1.r+1}, Col ${p1.c+1} / Row ${p2.r+1}, Col ${p2.c+1}. Try using "XY-Wing".`,
                    tier2: `Three cells, each holding only two candidates, form a chain: the pivot shares one candidate with each of the other two, and those two both also carry digit ${z} as their second candidate.`,
                    tier3: `Digit ${z} must end up in Row ${p1.r+1}, Col ${p1.c+1} or Row ${p2.r+1}, Col ${p2.c+1} — eliminate pencil mark ${z} from every other cell that can see both of them.`
                };
            }
        }
    }
    return null;
}

// 6c. XYZ-Wing — like XY-Wing, but the pivot keeps all three candidates
// {X,Y,Z} instead of narrowing to two, so eliminations must see the pivot
// too (not just the two linked cells).
function findXYZWing(candGrid, solutionGrid = solution) {
    const triValueCells = [];
    const biValueCells = [];
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (candGrid[r][c].length === 3) triValueCells.push({ r, c, cands: candGrid[r][c] });
            if (candGrid[r][c].length === 2) biValueCells.push({ r, c, cands: candGrid[r][c] });
        }
    }

    for (const pivot of triValueCells) {
        const [a, b, cDigit] = pivot.cands;
        const linked = biValueCells.filter(cell => cellsSeeEachOther(cell, pivot));

        for (const [d1, d2] of [[a, b], [a, cDigit], [b, cDigit]]) {
            const z = pivot.cands.find(d => d !== d1 && d !== d2);
            const p1Options = linked.filter(cell => cell.cands.includes(d1) && cell.cands.includes(z));
            const p2Options = linked.filter(cell => cell.cands.includes(d2) && cell.cands.includes(z));

            for (const p1 of p1Options) {
                for (const p2 of p2Options) {
                    if (p1.r === p2.r && p1.c === p2.c) continue;

                    const eliminate = [];
                    for (let r = 0; r < 9; r++) {
                        for (let c = 0; c < 9; c++) {
                            if ((r === pivot.r && c === pivot.c) || (r === p1.r && c === p1.c) || (r === p2.r && c === p2.c)) continue;
                            if (candGrid[r][c].includes(z) &&
                                cellsSeeEachOther({ r, c }, pivot) &&
                                cellsSeeEachOther({ r, c }, p1) &&
                                cellsSeeEachOther({ r, c }, p2)) {
                                eliminate.push({ r, c, digits: [z] });
                            }
                        }
                    }
                    if (eliminate.length === 0) continue;

                    return {
                        r: pivot.r, c: pivot.c,
                        val: solutionGrid[pivot.r][pivot.c],
                        method: "XYZ-Wing",
                        tier: "hard",
                        eliminate,
                        highlightCells: [pivot, p1, p2],
                        tier1: `Look at pencil marks in Row ${pivot.r+1}, Col ${pivot.c+1} (pivot) / Row ${p1.r+1}, Col ${p1.c+1} / Row ${p2.r+1}, Col ${p2.c+1}. Try using "XYZ-Wing".`,
                        tier2: `A three-candidate cell links to two two-candidate cells; all three share digit ${z} as a candidate, and it must appear in one of them.`,
                        tier3: `Digit ${z} must end up in the pivot (Row ${pivot.r+1}, Col ${pivot.c+1}) or one of its two linked cells — eliminate pencil mark ${z} from every other cell that can see all three.`
                    };
                }
            }
        }
    }
    return null;
}

// 6d. Unique Rectangle (Type 1) — four cells forming a rectangle across
// exactly two boxes. If three corners share the exact same two candidates
// and the fourth has those two plus more, the fourth corner can't actually
// be just those two — that would let the puzzle be solved two different
// ways (swap the two candidates between the matching corners), which a
// valid Sudoku never allows.
function findUniqueRectangle(candGrid, solutionGrid = solution) {
    for (let r1 = 0; r1 < 9; r1++) {
        for (let r2 = r1 + 1; r2 < 9; r2++) {
            const sameBoxRow = Math.floor(r1 / 3) === Math.floor(r2 / 3);
            for (let c1 = 0; c1 < 9; c1++) {
                for (let c2 = c1 + 1; c2 < 9; c2++) {
                    const sameBoxCol = Math.floor(c1 / 3) === Math.floor(c2 / 3);
                    if (sameBoxRow === sameBoxCol) continue; // must span exactly 2 boxes

                    const corners = [{ r: r1, c: c1 }, { r: r1, c: c2 }, { r: r2, c: c1 }, { r: r2, c: c2 }];
                    const cellCands = corners.map(({ r, c }) => candGrid[r][c]);
                    if (cellCands.some(cands => cands.length < 2)) continue;

                    for (let extraIdx = 0; extraIdx < 4; extraIdx++) {
                        const roofCands = [0, 1, 2, 3].filter(i => i !== extraIdx).map(i => cellCands[i]);
                        if (roofCands.some(cands => cands.length !== 2)) continue;
                        const [x, y] = roofCands[0];
                        if (!roofCands.every(cands => cands.length === 2 && cands.includes(x) && cands.includes(y))) continue;

                        const extraCands = cellCands[extraIdx];
                        if (!extraCands.includes(x) || !extraCands.includes(y) || extraCands.length <= 2) continue;

                        const extraCell = corners[extraIdx];
                        const cellList = corners.map(({ r, c }) => `Row ${r+1}, Col ${c+1}`).join(' / ');
                        return {
                            r: extraCell.r, c: extraCell.c,
                            val: solutionGrid[extraCell.r][extraCell.c],
                            method: "Unique Rectangle",
                            tier: "hard",
                            eliminate: [{ r: extraCell.r, c: extraCell.c, digits: [x, y] }],
                            highlightCells: corners,
                            tier1: `Look at pencil marks in the four-cell rectangle (${cellList}). Try using "Unique Rectangle".`,
                            tier2: `Four cells form a rectangle across two boxes. Three corners share the exact same two candidates — if the fourth corner also settled on just those two, the puzzle could be solved two different ways, which isn't allowed.`,
                            tier3: `To keep the solution unique, eliminate pencil marks ${x} and ${y} from Row ${extraCell.r+1}, Column ${extraCell.c+1} — whatever extra candidate remains there must be the real answer.`
                        };
                    }
                }
            }
        }
    }
    return null;
}

// 7. Direct Reveal Fallback (Guarantees solution continuity)
function findDirectRevealFallback(currentGrid, targetSolution) {
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (currentGrid[r][c] === 0) {
                const correctVal = targetSolution[r][c];
                const boxNum = Math.floor(r/3)*3 + Math.floor(c/3) + 1;
                return {
                    r, c, val: correctVal,
                    method: "Direct Reveal",
                    tier: "expert",
                    tier1: `None of this app's solving techniques apply here — this isn't a technique to learn, it's a direct reveal. Look at Row ${r+1}, Column ${c+1} in Box ${boxNum}.`,
                    tier2: `This happens when a puzzle genuinely needs logic beyond what this app's hint engine covers — or sometimes because some of your own pencil marks are incomplete and are hiding a technique that would otherwise apply. If you're not sure, try Auto-Pencil first.`,
                    tier3: `Place ${correctVal} in Row ${r+1}, Column ${c+1}.`
                };
            }
        }
    }
    return null;
}

function showHint() {
    if (gameWon) return;

    if (isBoardSolved()) {
        setStatusText("Board is complete!");
        return;
    }

    if (selectedCell) selectedCell.classList.remove("selected");
    selectedNumber = null;
    clearNumberHighlights();

    const currentGrid = getCurrentGrid();
    // Hints must reason from the *true*, constraint-derived candidate set,
    // never from the player's own hand-written pencil marks — a player is
    // never obligated to have marked every valid candidate in a cell, and
    // techniques like Naked Pair, X-Wing, or Unique Rectangle are only
    // logically sound when "this cell has exactly these N candidates" is
    // actually true. Trusting incomplete marks let the engine treat a
    // truly tri-valent cell as bivalue and eliminate/require digits that
    // contradicted the real solution (see REQUIREMENTS.md item 10).
    const candGrid = getCandidatesGridPure(currentGrid);

    // Easiest-technique-first cascade, shared with the difficulty rater —
    // see HINT_CASCADE and REQUIREMENTS.md items 2-5, 7-8.
    let hint = null;
    for (const { fn } of HINT_CASCADE) {
        hint = fn(currentGrid, candGrid, solution);
        if (hint) break;
    }
    hint = hint || findDirectRevealFallback(currentGrid, solution);

    if (!hint) {
        setStatusText("No more hints available.");
        return;
    }

    const { r, c, tier1, tier2, tier3, method, highlightCells } = hint;
    const cell = board.children[r * 9 + c];

    // onCellClick clears every cell's highlight classes as part of selecting
    // the primary cell, so it must run BEFORE the hint's own highlights are
    // applied below — marking every cell the hint actually refers to (not
    // just the first one) is the whole point here (see REQUIREMENTS.md item
    // 8). The marker itself, "hint-trace", is a separate class from
    // Highlight Fullest's "highlight-least" — different concept, different
    // color — and clearNumberHighlights() (which onCellClick() just ran)
    // deliberately doesn't touch it, so it survives clicking the cell to
    // act on the hint instead of vanishing right when it's needed most.
    onCellClick(cell);

    clearHintTrace();
    const cellsToHighlight = highlightCells && highlightCells.length ? highlightCells : [{ r, c }];
    cellsToHighlight.forEach(({ r: hr, c: hc }) => {
        const hCell = board.children[hr * 9 + hc];
        hCell.classList.add("hint-trace", "glow");
        setTimeout(() => hCell.classList.remove("glow"), 2000);
    });
    hintTraceCells = cellsToHighlight;
    hintTraceTarget = { r, c };

    const hintKey = `${r}_${c}`;
    if (currentHintState === hintKey) {
        currentHintLevel = (currentHintLevel % 3) + 1;
    } else {
        currentHintState = hintKey;
        currentHintLevel = 1;
    }

    if (currentHintLevel === 1) {
        setStatusText(`💡 Tier 1 (${method}): ${tier1} (Tap Hint to see more)`);
    } else if (currentHintLevel === 2) {
        setStatusText(`💡 Tier 2 (${method}): ${tier2} (Tap Hint to see answer)`);
    } else {
        setStatusText(`💡 Tier 3 (${method}): ${tier3}`);
    }
}

/* ==========================================================================
   5b. DIFFICULTY RATING ENGINE
   Solves a puzzle using only techniques up to a given tier, tracking which
   tiers were actually needed. Used by the generator to reject puzzles that
   don't match their declared difficulty, and by the regression tests to
   verify that calibration. See REQUIREMENTS.md items 2-5.
   ========================================================================== */
function getCandidatesGridPure(grid) {
    const cand = Array.from({ length: 9 }, () => Array.from({ length: 9 }, () => []));
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (grid[r][c] === 0) {
                for (let n = 1; n <= 9; n++) {
                    if (isSafe(grid, r, c, n)) cand[r][c].push(n);
                }
            }
        }
    }
    return cand;
}

function isGridFull(grid) {
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (grid[r][c] === 0) return false;
        }
    }
    return true;
}

// Repeatedly applies the same technique cascade used for live hints, but
// restricted to tiers <= maxTierRank, against a plain grid (no DOM/pencil
// marks involved). Elimination techniques (locked candidates, naked pair,
// X-Wing, Swordfish) narrow the candidate grid instead of placing a value;
// placement techniques (full house, hidden/naked single) fill a cell and
// force a fresh candidate recompute. Stops when nothing more can be
// deduced at the allowed tier.
function rateSolveWithTierCascade(puzzleGrid, solutionGrid, maxTierRank) {
    const grid = deepCopyGrid(puzzleGrid);
    const tiersUsed = new Set();
    let candGrid = getCandidatesGridPure(grid);
    let iterations = 0;

    while (iterations++ < 2000) {
        if (isGridFull(grid)) return { solved: true, tiersUsed };

        let acted = false;
        for (const { tier, kind, fn } of HINT_CASCADE) {
            if (HINT_TIER_RANK[tier] > maxTierRank) continue;
            const hint = fn(grid, candGrid, solutionGrid);
            if (!hint) continue;

            if (kind === "place") {
                grid[hint.r][hint.c] = solutionGrid[hint.r][hint.c];
                candGrid = getCandidatesGridPure(grid);
            } else if (hint.eliminate && hint.eliminate.length) {
                hint.eliminate.forEach(({ r, c, digits }) => {
                    candGrid[r][c] = candGrid[r][c].filter(x => !digits.includes(x));
                });
            } else {
                continue; // elimination technique that found nothing to eliminate — not real progress
            }
            tiersUsed.add(tier);
            acted = true;
            break;
        }
        if (!acted) return { solved: false, tiersUsed };
    }
    return { solved: false, tiersUsed, error: "iteration limit exceeded" };
}

// Checks a puzzle against the calibration bar for a declared difficulty
// (DIFFICULTY_REQUIREMENTS above): must be solvable using only techniques up
// to that tier, and (for medium/hard) must actually need at least one
// technique at that tier — otherwise it's really an easier puzzle wearing a
// harder label. Expert instead requires that it NOT be solvable with
// easy-through-hard techniques alone (it needs the direct-reveal fallback).
//
// Also reports `overshoot`: true when the puzzle *can't even be solved*
// using techniques up to the tier's own ceiling — meaning it's already
// harder than this difficulty, not just not-yet-hard-enough. Removing more
// givens only makes a puzzle harder, never easier, so once a dig overshoots
// there is no point continuing to dig toward the floor looking for this
// difficulty on the same trajectory; the generator uses this to bail out
// early instead of wasting the rest of its time budget on a dead end.
function evaluateDifficultyBar(puzzleGrid, solutionGrid, difficulty) {
    const reqs = DIFFICULTY_REQUIREMENTS[difficulty];
    if (!reqs) return { met: true, overshoot: false };
    const result = rateSolveWithTierCascade(puzzleGrid, solutionGrid, reqs.maxTier);
    if (reqs.requireUnsolvedAtMaxTier) return { met: !result.solved, overshoot: false };
    if (!result.solved) return { met: false, overshoot: true };
    const met = !reqs.requireTier || result.tiersUsed.has(reqs.requireTier);
    return { met, overshoot: false };
}

function meetsDifficultyBar(puzzleGrid, solutionGrid, difficulty) {
    return evaluateDifficultyBar(puzzleGrid, solutionGrid, difficulty).met;
}

/* ==========================================================================
   6. GENERATOR & ASYNC PUZZLE CREATOR
   ========================================================================== */
// Nominal starting given-count per difficulty (digging stops here if the
// puzzle already meets its difficulty bar), and a hard floor it may be dug
// down to if it doesn't (see REQUIREMENTS.md items 2-5). 17 is the proven
// theoretical minimum for any uniquely-solvable 9x9 grid, so it's a safe
// floor to allow digging toward — random uniqueness-preserving removal
// essentially never reaches it in practice, it just stops earlier once no
// remaining cell can be removed without breaking uniqueness.
const DIFFICULTY_GIVENS = {
    easy:   { target: 38, floor: 38 }, // never dig further: more givens only helps stay <= easy
    medium: { target: 32, floor: 26 },
    hard:   { target: 27, floor: 17 },
    expert: { target: 24, floor: 17 }
};

const SEED_POOLS = { hard: HARD_SEED_PUZZLES, expert: EXPERT_SEED_PUZZLES };

async function createNewPuzzleAsync(difficulty, generationId = ++activeGenerationId) {
    const seedPool = SEED_POOLS[difficulty];
    if (seedPool && seedPool.length > 0) {
        const seed = seedPool[Math.floor(Math.random() * seedPool.length)];
        const transformed = transformGridPair(seed);
        if (isValidBoardState(transformed.puzzle) && countSolutions(deepCopyGrid(transformed.puzzle), 2) === 1) {
            return transformed;
        }
    }

    // Every difficulty is calibrated against DIFFICULTY_REQUIREMENTS
    // (REQUIREMENTS.md items 2-5): a unique-solution dig isn't enough, the
    // result also has to actually need (or for Easy, not exceed; or for
    // Expert, defeat) techniques at its declared tier. A puzzle that doesn't
    // meet the bar at its nominal given-count is dug further, cell by cell,
    // down to a floor, re-checking the bar after each removal (removing
    // givens generally makes a puzzle harder, so this converges much faster
    // than re-rolling a whole new grid every time).
    const givensSpec = DIFFICULTY_GIVENS[difficulty];
    const targetGivens = givensSpec ? givensSpec.target : 27;
    // Landing exactly on "needs this tier's technique, nothing harder" gets
    // rarer as the tier goes up (a real Swordfish pattern is uncommon even at
    // very few givens), so Hard/Expert get a much larger retry budget than
    // Easy/Medium, which converge almost immediately.
    const CALIBRATION_ATTEMPTS_BY_DIFFICULTY = { easy: 25, medium: 60, hard: 400, expert: 200 };
    const MAX_CALIBRATION_ATTEMPTS = CALIBRATION_ATTEMPTS_BY_DIFFICULTY[difficulty] || 25;
    let attempts = 0;
    let lastCandidate = null;

    while (generationId === activeGenerationId) {
        attempts++;
        // Yield to the browser periodically so a long calibration search
        // (mainly Hard/Expert) doesn't freeze the UI — the caller already
        // shows a "Generating..." status before awaiting this function.
        if (attempts % 5 === 0) await new Promise(resolve => setTimeout(resolve, 0));
        const fullSolution = Array.from({ length: 9 }, () => Array(9).fill(0));
        solveSudoku(fullSolution);
        let puzzleGrid = deepCopyGrid(fullSolution);

        const cells = [];
        for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) cells.push({ r, c });
        cells.sort(() => Math.random() - 0.5);

        let currentGivens = 81;
        for (const { r, c } of cells) {
            if (generationId !== activeGenerationId) return null;
            if (currentGivens <= targetGivens) break;
            const backup = puzzleGrid[r][c];
            puzzleGrid[r][c] = 0;
            if (countSolutions(deepCopyGrid(puzzleGrid), 2) === 1) {
                currentGivens--;
            } else {
                puzzleGrid[r][c] = backup;
            }
        }

        if (!isValidBoardState(puzzleGrid) || countSolutions(deepCopyGrid(puzzleGrid), 2) !== 1) {
            continue;
        }

        if (!givensSpec || meetsDifficultyBar(puzzleGrid, fullSolution, difficulty)) {
            return { puzzle: puzzleGrid, solution: fullSolution };
        }

        // Doesn't meet the bar yet at the nominal given-count — keep digging
        // toward the floor, re-checking after every cell removed. Bail out
        // of this trajectory the moment it overshoots the tier (see
        // evaluateDifficultyBar) rather than digging all the way to the
        // floor for nothing — digging further from an overshot state can
        // only make the puzzle harder, never bring it back down to this tier.
        for (const { r, c } of cells) {
            if (generationId !== activeGenerationId) return null;
            if (puzzleGrid[r][c] === 0) continue;
            if (currentGivens <= givensSpec.floor) break;
            const backup = puzzleGrid[r][c];
            puzzleGrid[r][c] = 0;
            if (countSolutions(deepCopyGrid(puzzleGrid), 2) === 1) {
                currentGivens--;
                const evaluation = evaluateDifficultyBar(puzzleGrid, fullSolution, difficulty);
                if (evaluation.met) {
                    return { puzzle: puzzleGrid, solution: fullSolution };
                }
                if (evaluation.overshoot) break;
            } else {
                puzzleGrid[r][c] = backup;
            }
        }

        lastCandidate = { puzzle: puzzleGrid, solution: fullSolution };
        if (attempts >= MAX_CALIBRATION_ATTEMPTS) {
            console.warn(`Sudoku: gave up calibrating a ${difficulty} puzzle after ${attempts} attempts; serving the closest candidate found instead (see REQUIREMENTS.md items 2-5).`);
            return lastCandidate;
        }
    }
    return null;
}

/* ==========================================================================
   7. CONFETTI & WIN HANDLER
   ========================================================================== */
function resizeConfettiCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeConfettiCanvas);
resizeConfettiCanvas();

let confettiPieces = [];
let confettiRunning = false;

function startConfetti() {
    resizeConfettiCanvas();
    confettiPieces = [];
    const colors = ["#ff4b5c", "#ffb400", "#3ae374", "#17c0eb", "#9b59b6"];
    for (let i = 0; i < 200; i++) {
        confettiPieces.push({
            x: Math.random() * confettiCanvas.width,
            y: Math.random() * -confettiCanvas.height,
            w: 6 + Math.random() * 4,
            h: 8 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            speedY: 2 + Math.random() * 4,
            speedX: -1 + Math.random() * 2,
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: -0.1 + Math.random() * 0.2
        });
    }
    confettiRunning = true;
    requestAnimationFrame(confettiLoop);
}

function confettiLoop() {
    if (!confettiRunning) return;
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let active = false;
    confettiPieces.forEach(p => {
        if (p.y <= confettiCanvas.height + 20) {
            p.x += p.speedX;
            p.y += p.speedY;
            p.rotation += p.rotationSpeed;
            active = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
        }
    });
    if (active) requestAnimationFrame(confettiLoop);
    else stopConfetti();
}

function stopConfetti() {
    confettiRunning = false;
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

function stopBoardAnimations() {
    winOverlay.classList.remove("visible");
    winOverlay.setAttribute("aria-hidden", "true");
    board.classList.remove("board-win");
    stopConfetti();
}

function onWin() {
    if (gameWon) return;
    gameWon = true;
    board.classList.add("board-win");
    winOverlay.classList.add("visible");
    winOverlay.setAttribute("aria-hidden", "false");
    winMessage.textContent = "Puzzle complete! Great job.";
    localStorage.removeItem(STORAGE_KEY);
    startConfetti();
}

// Tap-to-skip: the win banner sits at a fixed distance from the top of the
// viewport and can overlap the control buttons on short screens, and
// confetti otherwise keeps falling for several seconds on its own. Neither
// the overlay nor the banner intercepts clicks (both are pointer-events:
// none, see CSS), so this listens on the whole document instead of any one
// element — tapping anywhere, including "through" the banner onto a
// button underneath, immediately clears all three (overlay, confetti,
// board glow) without exiting the won state itself.
document.addEventListener("click", () => {
    if (!gameWon) return;
    if (winOverlay.classList.contains("visible") || confettiRunning || board.classList.contains("board-win")) {
        stopBoardAnimations();
    }
});

// Same idea, but for the smaller in-progress glow (a row/column/box/digit
// you just completed): tapping anywhere — including on the board itself,
// unlike the listener below — immediately clears any cell still glowing
// from a *previous* action, instead of making you sit through several
// queued 2-second glows one after another if you finished multiple units
// in a row. Registered on the capture phase so it runs before the click's
// own handler (e.g. placing a digit) has a chance to add fresh glow —
// otherwise a click that completes a unit would wipe its own glow in the
// same synchronous dispatch before it ever got a chance to render.
document.addEventListener("click", () => {
    document.querySelectorAll(".cell.glow").forEach(cell => cell.classList.remove("glow"));
}, true);

// Tapping anywhere that isn't the board or an actual control (a button,
// the difficulty select, a number tile) clears the current cell selection
// and every highlight derived from it — same-number highlighting and
// Highlight Fullest. A click on the board itself reaches this listener too
// (it bubbles up after onCellClick already ran), so it's excluded here
// rather than re-selected.
document.addEventListener("click", (event) => {
    if (event.target.closest("#board, .top-bar, .controls-gameplay, .input-section")) return;
    if (selectedCell) selectedCell.classList.remove("selected");
    selectedCell = null;
    selectedNumber = null;
    clearNumberHighlights();
    updateNumberTileStyles();
});

// iOS Safari doesn't give real keyboard focus to a tapped <button>,
// <select>, or tabindex'd element the way every other browser does —
// tapping one with a finger visibly "does" something (a button looks
// pressed, a select opens its picker) without document.activeElement
// ever actually changing. So switching to an attached keyboard afterward
// resumed Tab from wherever focus last *genuinely* was (often nowhere in
// particular) instead of continuing from the control just tapped. This
// forces real focus on tap everywhere at once, rather than button by
// button; preventScroll avoids any jump since the tapped element is
// already on-screen by definition.
document.addEventListener("click", (event) => {
    const focusable = event.target.closest("button, select, [tabindex]");
    if (focusable && document.activeElement !== focusable) {
        focusable.focus({ preventScroll: true });
    }
});

document.getElementById("highlightLeastBtn").addEventListener("click", () => {
    if (gameWon) return;

    if (selectedCell) selectedCell.classList.remove("selected");
    selectedCell = null;
    clearNumberHighlights();

    currentHintState = null;
    currentHintLevel = 0;

    const grid = getCurrentGrid();
    let minEmpty = 10;
    const bestUnits = [];

    for (let r = 0; r < 9; r++) {
        const emptyCount = grid[r].filter(val => val === 0).length;
        if (emptyCount > 0) {
            if (emptyCount < minEmpty) {
                minEmpty = emptyCount;
                bestUnits.length = 0;
                bestUnits.push({ type: 'row', index: r, emptyCount });
            } else if (emptyCount === minEmpty) {
                bestUnits.push({ type: 'row', index: r, emptyCount });
            }
        }
    }

    for (let c = 0; c < 9; c++) {
        let emptyCount = 0;
        for (let r = 0; r < 9; r++) if (grid[r][c] === 0) emptyCount++;
        if (emptyCount > 0) {
            if (emptyCount < minEmpty) {
                minEmpty = emptyCount;
                bestUnits.length = 0;
                bestUnits.push({ type: 'col', index: c, emptyCount });
            } else if (emptyCount === minEmpty) {
                bestUnits.push({ type: 'col', index: c, emptyCount });
            }
        }
    }

    for (let b = 0; b < 9; b++) {
        const br = Math.floor(b / 3) * 3;
        const bc = (b % 3) * 3;
        let emptyCount = 0;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) if (grid[r][c] === 0) emptyCount++;
        }
        if (emptyCount > 0) {
            if (emptyCount < minEmpty) {
                minEmpty = emptyCount;
                bestUnits.length = 0;
                bestUnits.push({ type: 'box', index: b, emptyCount });
            } else if (emptyCount === minEmpty) {
                bestUnits.push({ type: 'box', index: b, emptyCount });
            }
        }
    }

    for (let n = 1; n <= 9; n++) {
        const placedCount = placements[n] ? placements[n].length : 0;
        const emptyCount = 9 - placedCount;
        if (emptyCount > 0) {
            if (emptyCount < minEmpty) {
                minEmpty = emptyCount;
                bestUnits.length = 0;
                bestUnits.push({ type: 'digit', index: n, emptyCount });
            } else if (emptyCount === minEmpty) {
                bestUnits.push({ type: 'digit', index: n, emptyCount });
            }
        }
    }

    if (bestUnits.length === 0) {
        setStatusText("All units are completely filled!", 3000);
        return;
    }

    const cellsToHighlight = new Set();
    const unitDescriptions = [];

    bestUnits.forEach(unit => {
        if (unit.type === 'row') {
            const r = unit.index;
            for (let c = 0; c < 9; c++) cellsToHighlight.add(r * 9 + c);
            unitDescriptions.push(`Row ${r+1}`);
        } else if (unit.type === 'col') {
            const c = unit.index;
            for (let r = 0; r < 9; r++) cellsToHighlight.add(r * 9 + c);
            unitDescriptions.push(`Col ${c+1}`);
        } else if (unit.type === 'box') {
            const b = unit.index;
            const br = Math.floor(b / 3) * 3;
            const bc = (b % 3) * 3;
            for (let r = br; r < br + 3; r++) {
                for (let c = bc; c < bc + 3; c++) cellsToHighlight.add(r * 9 + c);
            }
            unitDescriptions.push(`Box ${b+1}`);
        } else if (unit.type === 'digit') {
            const n = unit.index;
            if (placements[n]) {
                placements[n].forEach(idx => cellsToHighlight.add(idx));
            }
            unitDescriptions.push(`Digit ${n}`);
        }
    });

    cellsToHighlight.forEach(idx => board.children[idx].classList.add("highlight-least"));
    setStatusText(`Highlighting fullest area(s) [${unitDescriptions.join(", ")}] — only ${minEmpty} empty space(s) remaining!`);
});
