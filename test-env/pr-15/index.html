/* ==========================================================================
   9. ISOLATED NON-BLOCKING TEST HARNESS
   ========================================================================== */
(function runAutomatedRegressionTests() {
    if (!new URLSearchParams(window.location.search).has('test')) return;

    console.group("%c🧪 Executing Sudoku Regression Suite...", "color: #2563eb; font-weight: bold; font-size: 14px;");

    let passed = 0;
    let failed = 0;

    function assert(condition, message) {
        if (!condition) throw new Error(message);
    }

    // Landing exactly on a tier's required technique is probabilistic (see
    // CALIBRATION_ATTEMPTS_BY_DIFFICULTY): createNewPuzzleAsync occasionally
    // exhausts its bounded attempt budget and serves its closest
    // non-qualifying candidate rather than searching forever or freezing the
    // "New Game" button — that's by design, not a bug, so these tests
    // tolerate a small miss rate instead of demanding every single generated
    // puzzle qualify.
    async function assertMostlyCalibrated(difficulty, sampleSize, maxMisses, label) {
        let met = 0;
        for (let i = 0; i < sampleSize; i++) {
            const res = await createNewPuzzleAsync(difficulty);
            assert(res !== null, `${difficulty} generator returned null`);
            if (meetsDifficultyBar(res.puzzle, res.solution, difficulty)) met++;
        }
        assert(met >= sampleSize - maxMisses,
            `Only ${met}/${sampleSize} ${difficulty} puzzles ${label} — expected at most ${maxMisses} miss(es)`);
    }

    const tests = {
        testIsSafeEngine() {
            const grid = Array.from({ length: 9 }, () => Array(9).fill(0));
            grid[0][0] = 5;
            assert(!isSafe(grid, 0, 5, 5), "Row conflict missed");
            assert(!isSafe(grid, 5, 0, 5), "Column conflict missed");
            assert(!isSafe(grid, 2, 2, 5), "Box conflict missed");
            assert(isSafe(grid, 4, 4, 5), "Safe placement rejected");
        },

        async testEasyPuzzlesGenerator() {
            const res = await createNewPuzzleAsync("easy");
            assert(res !== null, "Generator returned null");
            assert(isValidBoardState(res.puzzle), "Generated puzzle contains initial duplicates");
            assert(countSolutions(deepCopyGrid(res.puzzle), 2) === 1, "Easy puzzle lacks unique solution");
        },

        // REQUIREMENTS.md item 2: solvable using only easy-tier hints.
        async testEasyPuzzleCalibration() {
            for (let i = 0; i < 3; i++) {
                const res = await createNewPuzzleAsync("easy");
                assert(res !== null, "Easy generator returned null");
                assert(meetsDifficultyBar(res.puzzle, res.solution, "easy"),
                    "Easy puzzle requires more than easy-tier techniques to solve");
            }
        },

        // REQUIREMENTS.md item 3: needs >=1 medium-tier hint (Naked Pair/Triple,
        // Pointing, Claiming, or X-Wing — X-Wing was folded into this tier
        // rather than kept as its own, since "exactly needs X-Wing, nothing
        // more" had gotten too rare once Medium's own roster grew), solvable
        // at medium-or-easier.
        async testMediumPuzzleCalibration() {
            await assertMostlyCalibrated("medium", 4, 1, "met the Medium bar (needs a medium technique, nothing harder)");
        },

        // REQUIREMENTS.md item 4: needs >=1 hard-tier (XY-Wing/XYZ-Wing/Unique
        // Rectangle/Swordfish) hint, solvable at hard-or-easier.
        async testHardPuzzleCalibration() {
            await assertMostlyCalibrated("hard", 6, 1, "met the Hard bar (needs one of XY-Wing/XYZ-Wing/Unique Rectangle/Swordfish, nothing harder)");
        },

        // REQUIREMENTS.md item 5: needs the fallback direct-reveal (i.e. NOT
        // fully solvable with easy-through-hard techniques alone).
        async testExpertPuzzleCalibration() {
            await assertMostlyCalibrated("expert", 4, 1, "needed the fallback reveal (weren't fully solvable through Hard techniques)");
        },

        async testHardSeedPuzzlesValidity() {
            for (let i = 0; i < HARD_SEED_PUZZLES.length; i++) {
                const seed = HARD_SEED_PUZZLES[i];
                const solCopy = deepCopyGrid(seed.solution);
                assert(solveSudoku(solCopy), `Hard seed ${i} solution is invalid`);
                assert(isValidBoardState(seed.puzzle), `Hard seed ${i} contains initial duplicate values`);
                assert(countSolutions(deepCopyGrid(seed.puzzle), 2) === 1, `Hard seed ${i} puzzle lacks unique solution`);
                assert(meetsDifficultyBar(seed.puzzle, seed.solution, "hard"), `Hard seed ${i} doesn't meet the Hard difficulty bar`);
            }
        },

        async testExpertSeedPuzzlesValidity() {
            for (let i = 0; i < EXPERT_SEED_PUZZLES.length; i++) {
                const seed = EXPERT_SEED_PUZZLES[i];
                const solCopy = deepCopyGrid(seed.solution);
                assert(solveSudoku(solCopy), `Expert seed ${i} solution is invalid`);
                assert(isValidBoardState(seed.puzzle), `Expert seed ${i} contains initial duplicate values`);
                assert(countSolutions(deepCopyGrid(seed.puzzle), 2) === 1, `Expert seed ${i} puzzle lacks unique solution`);
                assert(meetsDifficultyBar(seed.puzzle, seed.solution, "expert"), `Expert seed ${i} doesn't meet the Expert difficulty bar`);
            }
        },

        testStatePersistence() {
            // STORAGE_KEY is the same key a real player's save lives under —
            // this suite can run on the live site, not just a throwaway page,
            // so a real save must come back exactly as it was, not get
            // clobbered by whatever this test happens to write.
            const previousSave = localStorage.getItem(STORAGE_KEY);
            try {
                saveGameState();
                const saved = localStorage.getItem(STORAGE_KEY);
                assert(saved !== null, "localStorage failed to receive payload.");
                const parsed = JSON.parse(saved);
                assert(Array.isArray(parsed.puzzle), "Persisted puzzle grid missing.");
            } finally {
                if (previousSave === null) localStorage.removeItem(STORAGE_KEY);
                else localStorage.setItem(STORAGE_KEY, previousSave);
            }
        },

        // REQUIREMENTS.md item 7: every technique must supply all 3 hint
        // tiers. Solves several puzzles per difficulty using the full
        // HINT_CASCADE (headless, not the live board) and checks every hint
        // object produced along the way — from whichever techniques actually
        // fire for that puzzle — has well-formed tier1/tier2/tier3 text, a
        // valid tier, and a real target cell.
        async testHintObjectsWellFormed() {
            const problems = [];
            for (const diff of ["easy", "medium", "hard", "expert"]) {
                for (let i = 0; i < 4; i++) {
                    const res = await createNewPuzzleAsync(diff);
                    const grid = deepCopyGrid(res.puzzle);
                    let candGrid = getCandidatesGridPure(grid);
                    let iterations = 0;
                    while (iterations++ < 2000) {
                        if (isGridFull(grid)) break;
                        let acted = false;
                        for (const { kind, fn } of HINT_CASCADE) {
                            const hint = fn(grid, candGrid, res.solution);
                            if (!hint) continue;

                            for (const field of ["tier1", "tier2", "tier3"]) {
                                if (typeof hint[field] !== "string" || hint[field].length < 5) {
                                    problems.push(`${hint.method}: missing/short ${field}`);
                                }
                            }
                            if (!(hint.tier in HINT_TIER_RANK)) problems.push(`${hint.method}: invalid tier "${hint.tier}"`);
                            if (typeof hint.r !== "number" || typeof hint.c !== "number") problems.push(`${hint.method}: missing target cell`);

                            // Every mentioned cell (highlightCells) must be a real,
                            // in-bounds board coordinate, and must include the
                            // technique's own primary target cell — a hint that
                            // points at cells other than the one it's about would be
                            // confusing rather than helpful (see REQUIREMENTS.md item 8).
                            if (hint.highlightCells) {
                                if (hint.highlightCells.length === 0) problems.push(`${hint.method}: empty highlightCells`);
                                const outOfBounds = hint.highlightCells.some(({ r: hr, c: hc }) =>
                                    !(Number.isInteger(hr) && Number.isInteger(hc) && hr >= 0 && hr < 9 && hc >= 0 && hc < 9)
                                );
                                if (outOfBounds) problems.push(`${hint.method}: highlightCells has an out-of-bounds cell`);
                                const includesPrimary = hint.highlightCells.some(({ r: hr, c: hc }) => hr === hint.r && hc === hint.c);
                                if (!includesPrimary) problems.push(`${hint.method}: highlightCells doesn't include the primary target cell`);
                            }

                            // If tier3 claims an elimination directly resolves some
                            // cell to a single value ("This leaves N in Row R, Column
                            // C"), that claim must actually be true against the real
                            // candidate grid, not just plausible-sounding text — this
                            // is exactly the bug class caught in a live Pointing Pair
                            // hint (see REQUIREMENTS.md item 7).
                            const claim = hint.tier3.match(/This leaves (\d) in Row (\d+), Column (\d+)/);
                            if (claim) {
                                const [, claimedVal, claimedRow, claimedCol] = claim.map(Number);
                                const cr = claimedRow - 1, cc = claimedCol - 1;
                                const afterElimination = (candGrid[cr][cc] || []).filter(x =>
                                    !(hint.eliminate || []).some(e => e.r === cr && e.c === cc && e.digits.includes(x))
                                );
                                if (!(afterElimination.length === 1 && afterElimination[0] === claimedVal)) {
                                    problems.push(`${hint.method}: claimed "leaves ${claimedVal} in Row ${claimedRow}, Column ${claimedCol}" but that cell's remaining candidates after the elimination are [${afterElimination.join(',')}]`);
                                }
                            }

                            if (kind === "place") {
                                grid[hint.r][hint.c] = res.solution[hint.r][hint.c];
                                candGrid = getCandidatesGridPure(grid);
                            } else if (hint.eliminate && hint.eliminate.length) {
                                hint.eliminate.forEach(({ r, c, digits }) => {
                                    candGrid[r][c] = candGrid[r][c].filter(x => !digits.includes(x));
                                });
                            } else {
                                continue;
                            }
                            acted = true;
                            break;
                        }
                        if (!acted) break;
                    }
                }
            }
            assert(problems.length === 0, `${problems.length} malformed hint object(s): ${problems.slice(0, 5).join("; ")}`);
        }
    };

    setTimeout(async () => {
        for (const [name, testFn] of Object.entries(tests)) {
            if (window.testUI) window.testUI.setActiveTest(name);
            try {
                await testFn();
                const msg = `  ✔ ${name}`;
                console.log(`%c${msg}`, "color: #16a34a; font-weight: 500;");
                if (window.testUI) window.testUI.appendLine(msg, '#4ade80');
                passed++;
            } catch (err) {
                const msg = `  ✖ ${name}: ${err.message}`;
                console.error(msg);
                if (window.testUI) window.testUI.appendLine(msg, '#f87171');
                failed++;
            }
        }

        if (window.testUI) {
            window.testUI.setActiveTest(null);
            window.testUI.appendLine(`\nTest Results: ${passed} Passed, ${failed} Failed`, failed > 0 ? '#f87171' : '#4ade80');
            window.testUI.finishSuite(passed, failed);
        }

        console.log(`%c Test Results: ${passed} Passed, ${failed} Failed`, `color: ${failed > 0 ? '#dc2626' : '#16a34a'}; font-weight: bold;`);
        console.groupEnd();
    }, 100);
})();
</script>
</body>
